name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository and backend submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API type dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Generate Prisma runtime
        run: pnpm --dir backend exec prisma generate --generator client
        env:
          DATABASE_URL: file:./dev.db

      - name: Audit test coverage contract
        run: pnpm test:coverage-audit

      - name: Validate production migrations
        run: pnpm check:production-migrations

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit
