name: Deploy web to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and backend submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build OpenNext Worker
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          # Valid build-time fallbacks make the first deploy possible before its
          # workers.dev URL and production API URL are known.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vocab-learning-app.workers.dev' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm
          secrets: |
            JWT_SECRET
        env:
          # Must be identical to the API Worker's signing secret so Edge middleware can
          # verify learner and admin cookies.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployment URL: ${DEPLOYMENT_URL}"
