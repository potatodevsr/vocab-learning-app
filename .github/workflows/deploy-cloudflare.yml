name: Deploy web to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and backend submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Web unit specs import a few pure API helpers, so the root TypeScript program
      # resolves their Hono/prisma-guard types even though backend/ is excluded as a
      # source glob.
      - name: Install API type dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build OpenNext Worker
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          # Use the known workers.dev origin until a custom domain is configured. Never
          # ship localhost: Chrome treats that as an attempt to access services on the
          # visitor's private network.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vocab-learning-app.hoshiku1997.workers.dev' }}
          # The api Worker's own origin — never this Worker's `/api` path. The browser
          # does not use this value at all (it calls same-origin `/api/*`, which the
          # forwarder relays); server rendering and the forwarder do. Pointing it back at
          # the web origin is what made sign-up 404 — the forwarder now answers that
          # misconfiguration with a 502 that says so, instead of proxying to itself.
          NEXT_PUBLIC_API_URL: ${{ vars.API_ORIGIN || 'https://vocab-api.hoshiku1997.workers.dev' }}

      - name: Create or update Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Wrangler Action uploads secrets before running its command. A brand-new Worker
      # must therefore be created by the step above before its first secret upload.
      - name: Configure JWT secret and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
          wranglerVersion: "4.114.0"
          secrets: |
            JWT_SECRET
        env:
          # Must be identical to the API Worker's signing secret so Edge middleware can
          # verify learner and admin cookies.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: 'echo "Deployment URL: ${DEPLOYMENT_URL}"'
