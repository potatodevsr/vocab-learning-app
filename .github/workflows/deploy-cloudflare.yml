name: Deploy web to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and backend submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Web unit specs import a few pure API helpers, so the root TypeScript program
      # resolves their Hono/prisma-guard types even though backend/ is excluded as a
      # source glob.
      - name: Install API type dependencies
        run: pnpm --dir backend install --frozen-lockfile

      # Prisma's generated TypeScript imports Worker runtime JS/WASM files that are
      # intentionally gitignored. A clean runner must generate them before Wrangler
      # bundles the API Worker.
      - name: Generate API Worker runtime
        run: pnpm --dir backend exec prisma generate --generator client
        env:
          DATABASE_URL: file:./dev.db

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Applied migration files are immutable, and automatic production migrations may
      # only add schema/data. Anything destructive needs an explicit recovery plan rather
      # than silently riding along with an ordinary app deploy.
      - name: Validate production migrations
        run: pnpm check:production-migrations

      # Record the exact pre-change recovery point in the Actions run summary. Restoring
      # it remains a deliberate manual operation; this step only reads D1 state.
      - name: Capture D1 recovery bookmark
        run: |
          pnpm --dir backend exec wrangler d1 time-travel info vocab --json > d1-recovery.json
          echo '### D1 pre-migration recovery bookmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat d1-recovery.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm d1-recovery.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      # Static generation reads vocabulary from the API, so the API must exist and carry
      # the current schema before OpenNext prerenders any learner content.
      - name: Apply API migrations
        run: pnpm --dir backend exec wrangler d1 migrations apply vocab --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      # Both Workers must use the same signing key: the API issues auth cookies and the
      # web middleware verifies them. Leaving the API's manually configured value in
      # place creates a successful login followed by a redirect straight back to login.
      - name: Configure API JWT secret
        run: printf '%s' "$JWT_SECRET" | pnpm --dir backend exec wrangler secret put JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      - name: Deploy API Worker
        run: pnpm --dir backend exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      # Wrangler preserves existing Worker secrets during deploy. Refuse to continue if
      # production ever loses auth configuration instead of shipping a dead Google button.
      - name: Verify API auth secrets
        run: |
          pnpm --dir backend exec wrangler secret list > api-secrets.json
          node -e 'const fs=require("fs");const names=new Set(JSON.parse(fs.readFileSync("api-secrets.json","utf8")).map(({name})=>name));for(const required of ["JWT_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET"])if(!names.has(required))throw new Error(`Missing API Worker secret: ${required}`)'
          rm api-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      - name: Verify API is ready for prerendering
        run: curl --fail --retry 5 --retry-all-errors https://vocab-api.hoshiku1997.workers.dev/health

      - name: Build OpenNext Worker
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          # Use the known workers.dev origin until a custom domain is configured. Never
          # ship localhost: Chrome treats that as an attempt to access services on the
          # visitor's private network.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vocab-learning-app.hoshiku1997.workers.dev' }}
          # The api Worker's own origin — never this Worker's `/api` path. The browser
          # does not use this value at all (it calls same-origin `/api/*`, which the
          # forwarder relays); server rendering and the forwarder do. Pointing it back at
          # the web origin is what made sign-up 404 — the forwarder now answers that
          # misconfiguration with a 502 that says so, instead of proxying to itself.
          NEXT_PUBLIC_API_URL: ${{ vars.API_ORIGIN || 'https://vocab-api.hoshiku1997.workers.dev' }}

      - name: Create or update Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7e9643a4798eb8d75ab6a5a6f73f783

      # Wrangler Action uploads secrets before running its command. A brand-new Worker
      # must therefore be created by the step above before its first secret upload.
      - name: Configure JWT secret and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b7e9643a4798eb8d75ab6a5a6f73f783
          command: deploy
          packageManager: npm
          wranglerVersion: "4.114.0"
          secrets: |
            JWT_SECRET
        env:
          # Must be identical to the API Worker's signing secret so Edge middleware can
          # verify learner and admin cookies.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: 'echo "Deployment URL: ${DEPLOYMENT_URL}"'
